<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuspexLib — Online Library</title>
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="icon" type="image/png" href="img/auspexxx.png">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="/"><img src="img/auspexxx.png" alt="AuspexLib Logo" class="header__logo-img" width="48" height="72"></a>
                <span class="footer__brand--black">AuspexLib</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="catalog">
                <aside class="catalog__sidebar">
                    <h3 class="catalog__sidebar-title">Categories</h3>
                    <ul class="catalog__sidebar-list">
                        <li class="catalog__sidebar-item catalog__sidebar-item--selected">
                            <a href="#" class="catalog__sidebar-link" data-category="All">All</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Fiction">Fiction</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Science">Science</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="History">History</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Philosophy">Philosophy</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Mystery">Mystery</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Fantasy">Fantasy</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Mystery">Biography</a>
                        </li>
                        <li class="catalog__sidebar-item">
                            <a href="#" class="catalog__sidebar-link" data-category="Fantasy">Poetry</a>
                        </li>
                    </ul>
                </aside>

                <section class="catalog__main">
                    <div class="catalog__header">
                        <h1 class="catalog__title">All</h1>
                        <p class="catalog__count">Loading...</p>
                    </div>

                    <div class="catalog__grid">
                        <!-- Filled by JS -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__content">
                <div class="footer__section">
                    <div class="footer__logo">
                        <img src="img/auspexxx.png" alt="Auspex Logo" width="60" height="90">
                        <span class="footer__brand">AuspexLib</span>
                    </div>
                    <p class="footer__description">
                        Online library with a catalog of books loaded via Open Library API.
                    </p>
                </div>
            </div>
            <div class="footer__copyright">
                <p>&copy; 2025 Auspex Library. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
