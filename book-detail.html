<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book — AuspexLib</title>
    <link rel="icon" type="image/png" href="img/auspexxx.png">
  <script type="module" crossorigin src="/curs-front/assets/main-Yj0GwjrR.js"></script>
  <link rel="stylesheet" crossorigin href="/curs-front/assets/main-BhvJfqzB.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="/"><img src="img/auspexxx.png" alt="AuspexLib Logo" class="header__logo-img" width="48" height="72"></a>
                <span class="footer__brand--black">AuspexLib</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="book-detail">
            <div class="book-detail__container">
                <div class="book-detail__content">
                    <div class="book-detail__image-wrapper">
                        <!-- Filled by JS -->
                    </div>

                    <div class="book-detail__info">
                        <div class="book-detail__header">
                            <h1 class="book-detail__title" id="bookTitle">Loading...</h1>
                            <h2 class="book-detail__author" id="bookAuthor"></h2>
                        </div>

                        <div class="book-detail__meta">
                            <div class="book-detail__category">
                                <span class="book-detail__meta-label">Category:</span>
                                <span class="book-detail__meta-value" id="bookCategory">—</span>
                            </div>
                        </div>

                        <div class="book-detail__description">
                            <h3 class="book-detail__description-title">Description</h3>
                            <div class="book-detail__description-text" id="bookDescription">
                                <p>Loading description...</p>
                            </div>
                        </div>

                        <div class="book-detail__actions">
                            <a href="/" class="book-detail__btn book-detail__btn--secondary">
                                ← Back to catalog
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__content">
                <div class="footer__section">
                    <div class="footer__logo">
                        <img src="/curs-front/img/auspexxx.png" alt="Auspex Logo" width="60" height="90">
                        <span class="footer__brand">AuspexLib</span>
                    </div>
                    <p class="footer__description">
                        Online library with a catalog of books loaded via Open Library API.
                    </p>
                </div>
            </div>
            <div class="footer__copyright">
                <p>&copy; 2025 Auspex Library. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
